<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>はなしてみよう！</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFD93D; --orange:#FF6B6B; --green:#6BCB77;
    --blue:#4D96FF; --purple:#C77DFF; --pink:#FF9ECD; --dark:#3a3a5c;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e8f4fd;
    font-family:'Zen Maru Gothic',sans-serif;color:var(--dark)}
  #screenFrame{display:block;width:100%;height:100%;border:none}

  /* ---- アカウントボタン（左上） ---- */
  #acctBtn{
    position:fixed; z-index:50;
    top:calc(8px + env(safe-area-inset-top,0px)); left:8px;
    width:34px; height:34px; border-radius:50%;
    border:2px solid #c5d8ef; background:rgba(255,255,255,.92);
    font-size:1rem; line-height:1; cursor:pointer; padding:0;
    box-shadow:0 2px 0 #c5d8ef;
  }
  #acctMenu{
    position:fixed; z-index:51;
    top:calc(48px + env(safe-area-inset-top,0px)); left:8px;
    width:min(240px, calc(100vw - 16px));
    background:#fff; border:3px solid #c5d8ef; border-radius:18px;
    padding:.8rem .9rem; box-shadow:0 6px 0 #c5d8ef;
  }
  .acct-name{font-weight:900;font-size:1rem;word-break:break-all}
  .acct-sync{font-size:.78rem;color:#7a8eab;margin:.25rem 0 .7rem;font-weight:700}
  #logoutBtn{
    width:100%; font-family:inherit; font-weight:900; font-size:.95rem;
    padding:.55rem; border-radius:50px; cursor:pointer;
    border:3px solid #c5d8ef; background:#fff; color:#7a8eab;
  }

  /* ---- ログイン画面 ---- */
  #auth{
    position:fixed; inset:0; z-index:100; overflow-y:auto;
    display:flex; align-items:center; justify-content:center;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(ellipse at 15% 15%, #ffe0f0 0%, transparent 50%),
      radial-gradient(ellipse at 85% 85%, #d0eeff 0%, transparent 50%),
      radial-gradient(ellipse at 65% 5%,  #fff8a0 0%, transparent 40%),
      linear-gradient(160deg,#edf8ff 0%,#fde8ff 100%);
  }
  .auth-card{
    width:100%; max-width:380px; margin:auto;
    background:#fff; border-radius:28px; padding:1.4rem 1.3rem 1.2rem;
    box-shadow:0 8px 0 #c5d8ef; text-align:center;
  }
  .auth-logo{font-size:2.4rem;line-height:1}
  .auth-card h1{
    margin:.3rem 0 1rem; font-size:1.7rem; font-weight:900; letter-spacing:.05em;
    background:linear-gradient(90deg,var(--orange),var(--yellow),var(--green),var(--blue),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tabs{display:flex;gap:.5rem;margin-bottom:1rem}
  .tabs button{
    flex:1; font-family:inherit; font-weight:900; font-size:1rem;
    padding:.6rem .4rem; border-radius:50px; cursor:pointer;
    border:3px solid #c5d8ef; background:#fff; color:#7a8eab;
  }
  .tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .auth-card label{display:block;text-align:left;font-weight:700;font-size:.85rem;color:#7a8eab;margin-bottom:.8rem}
  .auth-card input{
    display:block; width:100%; margin-top:.3rem;
    font-family:inherit; font-size:1.1rem; /* 16px以上: iPhoneで拡大されない */
    padding:.7rem .9rem; border-radius:16px; border:3px solid #c5d8ef;
    background:#f7fbff; color:var(--dark); outline:none;
  }
  .auth-card input:focus{border-color:var(--blue);background:#fff}
  .pw{position:relative}
  .pw input{padding-right:3rem}
  #pwToggle{
    position:absolute; right:.4rem; top:50%; transform:translateY(-35%);
    border:none; background:transparent; font-size:1.2rem; cursor:pointer; padding:.3rem .5rem;
  }
  .hint{margin:.1rem 0 1rem;font-size:.78rem;line-height:1.6;color:#7a8eab;text-align:left}
  #submitBtn{
    width:100%; font-family:inherit; font-weight:900; font-size:1.15rem;
    padding:.8rem; border-radius:50px; cursor:pointer; color:#fff;
    border:none; background:var(--green); box-shadow:0 5px 0 #4aa85a;
  }
  #submitBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #4aa85a}
  #submitBtn:disabled{opacity:.6;cursor:default}
  .msg{min-height:1.4em;margin:.8rem 0 0;font-size:.85rem;font-weight:700;color:var(--orange);line-height:1.5}
</style>
</head>
<body>
<iframe id="screenFrame" title="はなしてみよう！"></iframe>

<button id="acctBtn" type="button" aria-label="アカウント" hidden>👤</button>
<div id="acctMenu" hidden>
  <div class="acct-name" id="acctName"></div>
  <div class="acct-sync" id="acctSync"></div>
  <button id="logoutBtn" type="button">ログアウト</button>
</div>

<div id="auth" hidden>
  <form id="authForm" class="auth-card" autocomplete="on">
    <div class="auth-logo">🎤</div>
    <h1>はなしてみよう！</h1>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">ログイン</button>
      <button type="button" id="tabSignup">はじめて</button>
    </div>
    <label>なまえ（ニックネーム）
      <input id="nick" name="username" type="text" maxlength="12" autocomplete="username"
             autocapitalize="off" spellcheck="false" placeholder="れい：たろう">
    </label>
    <label>パスワード
      <div class="pw">
        <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="6もじ いじょう">
        <button type="button" id="pwToggle" aria-label="パスワードをみる">👁</button>
      </div>
    </label>
    <p class="hint" id="hint"></p>
    <button type="submit" id="submitBtn">ログイン</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function showScreen(name) {
  // "kaiwa" は「にちじょうかいわコーナー」。れんしゅう画面を、かいわ用の表示で開く
  const src = SCREENS[name === "kaiwa" ? "practice" : name];
  if (!src || !user) return;
  pushNow();                                // 画面を移るタイミングでも保存
  let html = b64ToUtf8(src);
  if (name === "kaiwa") html = html.replace("<head>", "<head><script>window.HM_MODE='kaiwa'<\/script>");
  frame.srcdoc = html;
}
window.addEventListener("message", (e) => {
  if (e.source !== frame.contentWindow) return;   // 自分の画面からのメッセージだけ受け取る
  if (e.data && e.data.screen) showScreen(e.data.screen);
});

// ---------- Supabase ----------
let sb = null;
try {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });
} catch (e) { console.error("Supabase を読み込めませんでした", e); }

let user = null, nickname = "", lastSynced = "[]";

// ---------- 記録のマージ（同じ日は、回数が多いほうを残す） ----------
function safeParse(s) { try { const v = JSON.parse(s); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function cleanRecords(a) { return (Array.isArray(a) ? a : []).filter(r => r && typeof r === "object" && r.date); }
function mergeRecords(a, b) {
  const m = new Map();
  for (const r of [...cleanRecords(a), ...cleanRecords(b)]) {
    const o = m.get(r.date);
    const rt = r.total || 0, ot = o ? (o.total || 0) : -1;
    if (!o || rt > ot || (rt === ot && (r.correct || 0) >= (o.correct || 0))) m.set(r.date, r);
  }
  return [...m.values()].sort((x, y) => String(x.date).localeCompare(String(y.date)));
}

// ---------- ログイン画面 ----------
let mode = "login";
function setMsg(t) { $("msg").textContent = t || ""; }
function setMode(m) {
  mode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabSignup").classList.toggle("on", m === "signup");
  $("submitBtn").textContent = m === "login" ? "ログイン" : "とうろくしてはじめる";
  $("pw").autocomplete = m === "login" ? "current-password" : "new-password";
  $("hint").textContent = m === "login" ? "" :
    "ほんとうのなまえは つかわないでね。パスワードは6もじ いじょう。わすれると もどせないので、おうちのひとに メモしてもらってね。";
  setMsg("");
}
function showAuth() {
  $("auth").hidden = false; $("acctBtn").hidden = true; $("acctMenu").hidden = true;
  setMode("login");
}
$("tabLogin").onclick  = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");
$("pwToggle").onclick  = () => {
  const p = $("pw"); p.type = p.type === "password" ? "text" : "password";
};

// ニックネーム → ふりのメールアドレス（日本語もOKなように、ハッシュにする）
async function emailFor(nick) {
  const norm = nick.normalize("NFKC").trim().toLowerCase();
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hanashite-miyou:" + norm));
  const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
  return "hm-" + hex + "@" + FAKE_EMAIL_DOMAIN;   // "-" を含むので、本物のGmailアドレスとは重ならない
}

function friendlyError(err) {
  const code = err && (err.code || err.error_code) || "";
  const msg  = (err && err.message || "").toLowerCase();
  const tail = code || (err && err.status) ? "（" + (code || err.status) + "）" : "";
  console.error("auth error:", err);
  if (code === "user_already_exists" || msg.includes("already registered") || msg.includes("already been registered"))
    return "そのなまえは もうつかわれているよ。ほかのなまえにしてね";
  if (code === "invalid_credentials" || msg.includes("invalid login credentials"))
    return "なまえか パスワードが ちがうよ";
  if (code === "weak_password" || msg.includes("password should"))
    return "パスワードは 6もじ いじょうにしてね";
  if (code === "over_request_rate_limit" || code === "over_email_send_rate_limit" || err.status === 429)
    return "ちょっとまってから もういちど ためしてね";
  if (code === "signup_disabled")
    return "いまは あたらしくとうろくできないよ" + tail;
  if (code === "email_address_invalid" || msg.includes("email address") )
    return "とうろくの せっていに もんだいがあるよ。おうちのひとに そうだんしてね" + tail;
  if (msg.includes("failed to fetch") || msg.includes("network") || err.name === "AuthRetryableFetchError")
    return "インターネットに つながってないみたい";
  return "うまくいかなかったよ。もういちど ためしてね" + tail;
}

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  setMsg("");
  if (!sb) return setMsg("つながらないよ。ページを よみこみなおしてね");
  const nick = $("nick").value.trim();
  const pw = $("pw").value;
  if (!nick) return setMsg("なまえを いれてね");
  if ([...nick].length > 12) return setMsg("なまえは 12もじまでだよ");
  if (pw.length < 6) return setMsg("パスワードは 6もじ いじょうにしてね");

  $("submitBtn").disabled = true;
  try {
    const email = await emailFor(nick);
    let session;
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { nickname: nick } } });
      if (error) throw error;
      if (!data.session) {
        console.warn("signUp は成功しましたが session がありません（Confirm email が ON の可能性）");
        return setMsg("とうろくできなかったよ。ほかのなまえで ためしてね（だめなら おうちのひとに そうだんしてね）");
      }
      session = data.session;
      // この端末に「アカウントができる前」の記録があれば、ひきつぐか聞く
      const hadOwner = localStorage.getItem(OWNER_KEY);
      const localRecs = cleanRecords(safeParse(localStorage.getItem(REC_KEY) || "[]"));
      if (!hadOwner && localRecs.length > 0) {
        if (confirm("この たんまつの きろくを、このアカウントに ひきつぎますか？")) {
          localStorage.setItem(OWNER_KEY, session.user.id);
          localStorage.setItem(SYNCED_KEY, "[]");
        } else {
          localStorage.removeItem(REC_KEY);
        }
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      session = data.session;
    }
    $("pw").value = "";
    await enterApp(session, nick);
  } catch (err) {
    setMsg(friendlyError(err));
  } finally {
    $("submitBtn").disabled = false;
  }
});

// ---------- ログイン後：クラウドから取り込み → アプリ開始 ----------
async function pullAndPrepare() {
  const sameOwner = localStorage.getItem(OWNER_KEY) === user.id;
  let server = null;
  try {
    const { data, error } = await sb.from("user_data").select("records").eq("user_id", user.id).maybeSingle();
    if (error) throw error;
    if (data) {
      server = cleanRecords(data.records);
    } else {
      const { error: e2 } = await sb.from("user_data").upsert({ user_id: user.id, nickname, records: [] });
      if (e2) throw e2;
      server = [];
    }
  } catch (err) {
    console.warn("きろくの取り込みに失敗:", err);
    if (!sameOwner) throw err;                 // 別の人の端末データは使えない
    setStatus("error");                         // 同じ人なら、この端末の記録で続ける
    return;
  }
  const serverStr = JSON.stringify(server);
  const localStr = localStorage.getItem(REC_KEY);
  const syncedStr = localStorage.getItem(SYNCED_KEY);
  let finalArr = server;
  if (sameOwner && localStr && localStr !== syncedStr) {      // まだ送れていない変更がある
    finalArr = mergeRecords(server, safeParse(localStr));
  }
  const finalStr = JSON.stringify(finalArr);
  localStorage.setItem(REC_KEY, finalStr);
  localStorage.setItem(OWNER_KEY, user.id);
  localStorage.setItem(SYNCED_KEY, serverStr);
  lastSynced = serverStr;
  if (finalStr !== serverStr) schedulePush(0);
  else setStatus("saved");
}

async function enterApp(session, nickHint) {
  user = session.user;
  nickname = (user.user_metadata && user.user_metadata.nickname) || nickHint || "ゲスト";
  try {
    await pullAndPrepare();
  } catch (err) {
    user = null;
    throw err;
  }
  $("acctName").textContent = "👤 " + nickname;
  $("auth").hidden = true;
  $("acctBtn").hidden = false;
  showScreen("start");
}

// ---------- クラウドへ保存 ----------
let pushing = false, pushTimer = null, syncStatus = "saved";
function setStatus(s) {
  syncStatus = s;
  $("acctSync").textContent =
    s === "saved"  ? "☁️ きろくは ほぞんされているよ" :
    s === "saving" ? "☁️ ほぞんちゅう…" :
                     "⚠️ ほぞんできてないよ（あとで もういちど）";
}
function schedulePush(ms) {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, ms === undefined ? 1500 : ms);
}
async function pushNow() {
  if (!sb || !user || pushing) return;
  const cur = localStorage.getItem(REC_KEY) || "[]";
  if (cur === lastSynced) { if (syncStatus !== "saved") setStatus("saved"); return; }
  pushing = true; setStatus("saving");
  let ok = false;
  try {
    let toSend = cur;
    const { data, error } = await sb.from("user_data").select("records").eq("user_id", user.id).maybeSingle();
    if (error) throw error;
    const serverStr = JSON.stringify(cleanRecords(data && data.records));
    if (data && serverStr !== lastSynced) {          // ほかの端末で更新されていたら、合体させる
      toSend = JSON.stringify(mergeRecords(JSON.parse(serverStr), safeParse(cur)));
    }
    const { error: e2 } = await sb.from("user_data").upsert({
      user_id: user.id, nickname, records: JSON.parse(toSend), updated_at: new Date().toISOString()
    });
    if (e2) throw e2;
    if (toSend !== cur && localStorage.getItem(REC_KEY) === cur) localStorage.setItem(REC_KEY, toSend);
    lastSynced = toSend;
    localStorage.setItem(SYNCED_KEY, toSend);
    ok = true;
  } catch (err) {
    console.warn("きろくの保存に失敗:", err);
  } finally {
    pushing = false;
  }
  setStatus(ok ? "saved" : "error");
  if (!ok) schedulePush(15000);
  else if ((localStorage.getItem(REC_KEY) || "[]") !== lastSynced) schedulePush(500);
}
window.addEventListener("storage", (e) => { if (e.key === REC_KEY && user) schedulePush(1500); });
setInterval(() => {
  if (user && !pushing && (localStorage.getItem(REC_KEY) || "[]") !== lastSynced) schedulePush(500);
}, 4000);
document.addEventListener("visibilitychange", () => { if (document.hidden) pushNow(); });
window.addEventListener("pagehide", () => { pushNow(); });

// ---------- アカウントメニュー／ログアウト ----------
$("acctBtn").onclick = (e) => { e.stopPropagation(); $("acctMenu").hidden = !$("acctMenu").hidden; };
document.addEventListener("click", (e) => {
  if (!$("acctMenu").hidden && !$("acctMenu").contains(e.target)) $("acctMenu").hidden = true;
});
$("logoutBtn").onclick = async () => {
  await pushNow();
  if ((localStorage.getItem(REC_KEY) || "[]") !== lastSynced &&
      !confirm("きろくが まだ ほぞんされていないよ。ログアウトすると きえるかも。ログアウトする？")) return;
  const u = user; user = null;
  try { await sb.auth.signOut(); } catch (e) { console.warn(e); }
  [REC_KEY, OWNER_KEY, SYNCED_KEY].forEach(k => localStorage.removeItem(k));   // つぎの人に見えないようにする
  frame.srcdoc = "";
  $("nick").value = ""; $("pw").value = "";
  showAuth();
};
if (sb) sb.auth.onAuthStateChange((ev) => {
  if (ev === "SIGNED_OUT" && user) { user = null; frame.srcdoc = ""; showAuth(); }
});

// ---------- 起動 ----------
(async () => {
  if (!sb) { showAuth(); return setMsg("つながらないよ。ページを よみこみなおしてね"); }
  try {
    const { data } = await sb.auth.getSession();
    if (data.session) { await enterApp(data.session); return; }
  } catch (err) {
    console.warn(err);
    showAuth();
    return setMsg("インターネットに つながってないみたい。つながってから もういちど ためしてね");
  }
  showAuth();
})();
</script>
